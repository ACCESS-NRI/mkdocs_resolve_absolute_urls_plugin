[project]
name = "mkdocs-resolve-absolute-urls-plugin"
dynamic = ["version"]
authors = [
    {name = "Davide Marchegiani", email="davide.marchegiani@anu.edu.au"},
]
maintainers = [
    { name = "ACCESS-NRI", email = "access.nri@anu.edu.au" }
]
description = "A MkDocs plugin that resolves absolute URLs relative to a configurable root url, with support for multi-version and multi-locale documentation sites based on the configurable url versioning scheme."
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["mkdocs", "plugin", "mkdocs plugin", "access-nri"]
requires-python = ">=3.10"
dependencies = [
    "mkdocs>=1.6,<2.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/ACCESS-NRI/mkdocs_resolve_absolute_urls_plugin"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=80", 
    "setuptools-scm[simple]>=8",
]

[project.entry-points."mkdocs.plugins"]
resolve-absolute-urls = "resolve_absolute_urls.plugin:ResolveAbsoluteUrlsPlugin"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests/"]
addopts = "--cov=src --cov-report=term-missing"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"