name: CD

on:
    push:
      tags:
        - '**'
env:
  RELEASE_TAG_REGEX: ^[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  check-release-tag:
    name: Check release tag
    runs-on: ubuntu-latest
    outputs:
        is_release_tag: ${{ steps.check-tag.outputs.is_release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check tag
        id: check-tag
        run: |
          is_release_tag=true
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ${{ env.RELEASE_TAG_REGEX }} ]]; then
            echo "::warning::The tag '$tag' was not recognised as a release tag (MAJOR.MINOR.PATCH format). Therefore, no release was created."
            is_release_tag=false
          fi
          echo "is_release_tag=$is_release_tag" >> $GITHUB_OUTPUT
    
  version-sanity-check:
    name: Version sanity check
    needs: [check-release-tag]
    if: ${{ needs.check-release-tag.outputs.is_release_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-tags: true

      - name: Check version
        uses: access-nri/actions/.github/actions/version-check@main
        with: 
          versioning-scheme: semver

  get-package-name:
    name: Get package name
    needs: [check-release-tag]
    if: ${{ needs.check-release-tag.outputs.is_release_tag == 'true' }}
    runs-on: ubuntu-latest
    outputs:
        package-name: ${{ steps.get-package-name.outputs.package-name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Get name
        id: get-package-name
        run: |
          echo "package-name=$(yq '.project.name' pyproject.toml)" >> $GITHUB_OUTPUT

  create-release:
    name: Create release
    needs: [check-release-tag, version-sanity-check, get-package-name]
    if: ${{ needs.check-release-tag.outputs.is_release_tag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 #v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  cleanup-on-failure:
    name: Cleanup on failure
    runs-on: ubuntu-latest
    needs: create-release
    # Run this job if any of the previous jobs failed, or if the workflow was cancelled
    if: always() && needs.create-release.result != 'success'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0 
      
      # Delete newly created tag
      - name: Cleanup tag
        run: |
          git push origin ':${{ github.ref }}'
          echo "A job in the current workflow failed. Tag '${{ github.ref }}' was deleted."
      
      # Delete newly created GitHub release
      - name: Cleanup GitHub release
        run: |
           gh release delete '${{ github.ref_name }}' && echo "GitHub release was deleted." || echo "No GitHub release '${{ github.ref_name }}' to delete."